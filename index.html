<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8d7c9">
<title>Ode à la joie — Verres musicaux</title>
<style>
:root{
  --ink:#25314b; --muted:#6d7484; --card:#ffffffd9;
  --do:#ff4f86; --re:#ff9a3d; --mi:#ffd23f; --fa:#39d98a; --sol:#3aa7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
body{
  background:
    radial-gradient(circle at 15% 10%,#fff8 0 2%,transparent 3%),
    linear-gradient(180deg,#f9d6c8 0%,#f6c6a5 24%,#d7e7f5 54%,#f6dfc0 100%);
}
#app{position:relative;width:100vw;height:100dvh;min-height:100vh;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
header{text-align:center;padding-top:4px}
h1{font-size:30px;line-height:1;margin:2px 0 3px;font-family:Georgia,serif;font-style:italic}
.sub{font-size:12px;font-weight:800;letter-spacing:.4px;color:#3e465d}
.topRow{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;margin-top:9px}
.card{background:var(--card);border:2px solid #fff;border-radius:20px;box-shadow:0 10px 22px #684a4217;padding:10px}
.card h2{font-size:14px;margin:0 0 5px}
.tiny{font-size:10px;color:var(--muted);margin-bottom:7px}
.note-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.noteBtn{border:0;border-radius:10px;padding:8px 2px;font-size:12px;font-weight:900;color:#263047}
.noteBtn small{display:block;font-size:8px;margin-top:1px}
.noteBtn[data-note="1"]{background:#ffb7cf}.noteBtn[data-note="2"]{background:#ffd0a2}
.noteBtn[data-note="3"]{background:#ffe994}.noteBtn[data-note="4"]{background:#bff0d2}.noteBtn[data-note="5"]{background:#bdddff}
.tempo{text-align:center}.tempo strong{font-size:19px}.tempo input{width:100%}

.glassStage{
  height:43vh;min-height:330px;margin-top:9px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:end
}
.glassWrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.noteTag{font-weight:900;font-size:13px;margin-bottom:5px;padding:4px 9px;border-radius:999px;background:#ffffffb8}
.wineGlass{position:relative;width:96%;height:79%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bowl{
  position:relative;width:84%;height:62%;border:3px solid #ffffffdd;border-top-width:4px;
  border-radius:42% 42% 47% 47% / 16% 16% 70% 70%;
  overflow:hidden;background:#ffffff20;box-shadow:inset 0 0 0 1px #53607d26,0 6px 14px #40506a12
}
.liquid{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:var(--c);opacity:.9;box-shadow:inset 0 8px 12px #ffffff3d
}
.liquid:before{content:"";position:absolute;left:3%;right:3%;top:-4px;height:8px;border-radius:50%;background:#ffffff55}
.stem{width:4px;height:20%;background:#ffffffd5;border-radius:5px;box-shadow:0 0 0 1px #5d698329}
.base{width:54%;height:7px;border-radius:50%;background:#ffffffb8;box-shadow:0 0 0 1px #5d698329}
.glow{position:absolute;inset:10% 3% 0;border-radius:30px;opacity:0;box-shadow:0 0 26px var(--c);transition:.08s;pointer-events:none}
.glassWrap.play .glow{opacity:1}
.glassWrap.play .bowl{transform:scale(1.035)}
.musicNote{position:absolute;top:10%;right:10%;font-size:24px;color:var(--c);opacity:0}
.glassWrap.play .musicNote{animation:floatNote .5s ease-out 1}
@keyframes floatNote{0%{opacity:0;transform:translateY(8px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.15) rotate(12deg)}}

.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:7px;margin-top:7px}
.controls button{border:0;border-radius:15px;padding:11px 6px;font-size:13px;font-weight:900}
#start{background:#25bb5b;color:#fff;font-size:15px}
#pause{background:#eef1f6;color:#39445e}#reset{background:#f7f2f0;color:#39445e}
.status{text-align:center;margin-top:5px;font-size:13px;font-weight:900;min-height:20px}
.players{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:3px}
.player{font-size:9px;text-align:center;border-radius:11px;padding:5px 2px;background:#ffffff99}
.player b{display:block;font-size:11px}
.p1{background:#ffd4e1}.p2{background:#ffe0bd}.p3{background:#fff0b8}.p4{background:#d5f3df}.p5{background:#d9ebff}
.legend{text-align:center;font-size:9px;color:#5e6472;margin-top:4px}
@media(max-height:700px){
  h1{font-size:25px}.topRow{margin-top:5px}.glassStage{height:39vh;min-height:280px}
  .card{padding:7px}.controls button{padding:9px 4px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Ode à la joie</h1>
  <div class="sub">VERRES MUSICAUX · 5 JOUEURS · 5 VERRES</div>
</header>

<div class="topRow">
  <section class="card">
    <h2>🎧 Accorder les verres</h2>
    <div class="tiny">Appuie sur une note pour l’entendre.</div>
    <div class="note-buttons">
      <button class="noteBtn" data-note="1">DO<small>C4</small></button>
      <button class="noteBtn" data-note="2">RÉ<small>D4</small></button>
      <button class="noteBtn" data-note="3">MI<small>E4</small></button>
      <button class="noteBtn" data-note="4">FA<small>F4</small></button>
      <button class="noteBtn" data-note="5">SOL<small>G4</small></button>
    </div>
  </section>
  <section class="card tempo">
    <h2>⏱ Tempo</h2>
    <strong id="bpmText">70 BPM</strong>
    <input id="bpm" type="range" min="40" max="160" step="5" value="70">
  </section>
</div>

<main class="glassStage">
  <div class="glassWrap" id="g1" style="--c:var(--do)">
    <div class="noteTag">DO</div><div class="musicNote">♪</div><div class="glow"></div>
    <div class="wineGlass"><div class="bowl"><div class="liquid"></div></div><div class="stem"></div><div class="base"></div></div>
  </div>
  <div class="glassWrap" id="g2" style="--c:var(--re)">
    <div class="noteTag">RÉ</div><div class="musicNote">♫</div><div class="glow"></div>
    <div class="wineGlass"><div class="bowl"><div class="liquid"></div></div><div class="stem"></div><div class="base"></div></div>
  </div>
  <div class="glassWrap" id="g3" style="--c:var(--mi)">
    <div class="noteTag">MI</div><div class="musicNote">♪</div><div class="glow"></div>
    <div class="wineGlass"><div class="bowl"><div class="liquid"></div></div><div class="stem"></div><div class="base"></div></div>
  </div>
  <div class="glassWrap" id="g4" style="--c:var(--fa)">
    <div class="noteTag">FA</div><div class="musicNote">♫</div><div class="glow"></div>
    <div class="wineGlass"><div class="bowl"><div class="liquid"></div></div><div class="stem"></div><div class="base"></div></div>
  </div>
  <div class="glassWrap" id="g5" style="--c:var(--sol)">
    <div class="noteTag">SOL</div><div class="musicNote">♪</div><div class="glow"></div>
    <div class="wineGlass"><div class="bowl"><div class="liquid"></div></div><div class="stem"></div><div class="base"></div></div>
  </div>
</main>

<div class="controls">
  <button id="reset">↺ Recommencer</button>
  <button id="start">▶ Démarrer</button>
  <button id="pause">Ⅱ Pause</button>
</div>
<div class="status" id="status">Prêts ? ✨</div>

<div class="players">
  <div class="player p1">Joueur 1<b>DO</b></div>
  <div class="player p2">Joueur 2<b>RÉ</b></div>
  <div class="player p3">Joueur 3<b>MI</b></div>
  <div class="player p4">Joueur 4<b>FA</b></div>
  <div class="player p5">Joueur 5<b>SOL</b></div>
</div>
<div class="legend">Le verre se remplit avant chaque note · puis se vide immédiatement après</div>
</div>

<script>
(function(){
"use strict";

/*
Durées rythmiques en "temps".
1 = noire, 2 = blanche.
Cette version respecte les notes tenues principales du thème.
*/
var song = [
  [3,1],[3,1],[4,1],[5,1],[5,1],[4,1],[3,1],[2,1],
  [1,1],[1,1],[2,1],[3,1],[3,1.5],[2,.5],[2,2],

  [3,1],[3,1],[4,1],[5,1],[5,1],[4,1],[3,1],[2,1],
  [1,1],[1,1],[2,1],[3,1],[2,1.5],[1,.5],[1,2],

  [2,1],[2,1],[3,1],[1,1],[2,1],[3,.5],[4,.5],[3,1],[1,1],
  [2,1],[3,.5],[4,.5],[3,1],[2,1],[1,1],[2,1],[5,2],

  [3,1],[3,1],[4,1],[5,1],[5,1],[4,1],[3,1],[2,1],
  [1,1],[1,1],[2,1],[3,1],[2,1.5],[1,.5],[1,2]
];

var names={1:"DO",2:"RÉ",3:"MI",4:"FA",5:"SOL"};
var freqs={1:261.63,2:293.66,3:329.63,4:349.23,5:392.00};
var idx=0,running=false,timer=null,audioCtx=null;
var bpm=document.getElementById("bpm"),bpmText=document.getElementById("bpmText"),status=document.getElementById("status");

function beatMs(){return 60000/Number(bpm.value)}
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function glassTone(n,durSec){
  initAudio();
  var now=audioCtx.currentTime;
  var master=audioCtx.createGain();
  master.gain.setValueAtTime(.0001,now);
  master.gain.exponentialRampToValueAtTime(.28,now+.006);
  master.gain.exponentialRampToValueAtTime(.0001,now+durSec);
  master.connect(audioCtx.destination);

  var partials=[
    [1.00,"sine",1.00],
    [2.01,"sine",0.24],
    [3.92,"sine",0.10],
    [5.35,"sine",0.05]
  ];
  partials.forEach(function(p){
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=p[1];o.frequency.value=freqs[n]*p[0];g.gain.value=p[2];
    o.connect(g);g.connect(master);o.start(now);o.stop(now+durSec+.03);
  });
}
function emptyGlass(n){
  var w=document.getElementById("g"+n);
  w.classList.remove("play");
  var l=w.querySelector(".liquid");
  l.style.transition="none";
  l.style.height="0%";
}
function emptyAll(){
  for(var i=1;i<=5;i++)emptyGlass(i);
}
function fillGlass(n,duration){
  var w=document.getElementById("g"+n),l=w.querySelector(".liquid");
  w.classList.remove("play");
  l.style.transition="none";
  l.style.height="0%";
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      l.style.transition="height "+duration+"ms linear";
      l.style.height="100%";
    });
  });
}
function flashPlay(n,noteDurationMs){
  var w=document.getElementById("g"+n);
  w.classList.add("play");
  status.textContent="Joue : "+names[n]+" 🎵";
  glassTone(n,Math.max(.45,noteDurationMs/1000*.85));
  if(navigator.vibrate){try{navigator.vibrate(25)}catch(e){}}
}
function scheduleStep(){
  if(!running)return;
  if(idx>=song.length){
    running=false;emptyAll();status.textContent="🎉 Terminé !";return;
  }

  var current=song[idx];
  var note=current[0];
  var beats=current[1];
  var dur=beatMs()*beats;

  // A chaque événement, même si c'est la même note que juste avant :
  // on vide d'abord complètement le verre, puis on le remplit de nouveau.
  emptyAll();
  fillGlass(note,Math.max(160,dur*.72));
  status.textContent="Prépare : "+names[note];

  var playDelay=Math.max(120,dur*.72);
  var playTimer=setTimeout(function(){
    if(!running)return;
    flashPlay(note,dur-playDelay);
  },playDelay);

  timer=setTimeout(function(){
    clearTimeout(playTimer);
    emptyGlass(note);
    idx++;
    scheduleStep();
  },dur);
}
function countdown(n){
  if(!running)return;
  emptyAll();
  if(n<=0){scheduleStep();return}
  status.textContent=n+"…";
  timer=setTimeout(function(){countdown(n-1)},650);
}
function start(){
  initAudio();
  if(running)return;
  running=true;
  if(idx===0)countdown(3);else scheduleStep();
}
function pause(){
  running=false;
  if(timer)clearTimeout(timer);
  emptyAll();
  status.textContent="En pause";
}
function reset(){
  running=false;
  if(timer)clearTimeout(timer);
  idx=0;
  emptyAll();
  status.textContent="Prêts ? ✨";
}
bpm.addEventListener("input",function(){bpmText.textContent=bpm.value+" BPM"});
document.getElementById("start").addEventListener("click",start);
document.getElementById("pause").addEventListener("click",pause);
document.getElementById("reset").addEventListener("click",reset);

document.querySelectorAll(".noteBtn").forEach(function(btn){
  btn.addEventListener("click",function(){
    var n=Number(btn.dataset.note);
    emptyAll();
    fillGlass(n,300);
    setTimeout(function(){
      flashPlay(n,900);
      setTimeout(function(){emptyGlass(n)},650);
    },300);
  });
});
})();
</script>
</body>
</html>
